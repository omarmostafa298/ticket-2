<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Meinhardt IT Helpdesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-screen">

  <div class="login-card" id="login-box">
    <img src="logo.png" alt="Meinhardt" class="login-logo">
    <h1 class="login-title">IT Helpdesk</h1>
    <p class="login-subtitle">Sign in to raise or track a ticket</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="login-username">Username</label>
        <input type="text" id="login-username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" autocomplete="current-password" required>
      </div>
      <p class="form-error" id="auth-error"></p>
      <button type="submit" class="btn-primary">Sign in</button>
    </form>

    <p class="login-footer">No account? <a href="#" id="show-register">Register</a></p>
  </div>

  <div class="login-card hidden" id="register-box">
    <img src="logo.png" alt="Meinhardt" class="login-logo">
    <h1 class="login-title">Create account</h1>
    <p class="login-subtitle">Register to submit IT tickets</p>

    <form id="register-form" novalidate>
      <div class="field">
        <label for="register-username">Username</label>
        <input type="text" id="register-username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="register-password">Password</label>
        <input type="password" id="register-password" autocomplete="new-password" minlength="4" required>
      </div>
      <button type="submit" class="btn-primary">Create account</button>
    </form>

    <p class="login-footer">Already have an account? <a href="#" id="show-login">Sign in</a></p>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
