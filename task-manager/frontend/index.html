<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Meinhardt IT Helpdesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-screen">
  <div class="login-card">
    <img src="logo.png" alt="Meinhardt" class="login-logo">
    <h1 class="login-title">IT Helpdesk</h1>
    <p class="login-subtitle">Sign in to raise or track a ticket</p>

    <form id="login-form" novalidate>
      <div class="field" id="email-field">
        <label for="email">Work email</label>
        <input type="email" id="email" name="email" placeholder="name@meinhardt.com" autocomplete="username">
        <div class="field-error">Enter your work email.</div>
      </div>

      <div class="field" id="password-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
        <div class="field-error">Enter your password.</div>
      </div>

      <div class="login-row">
        <label><input type="checkbox" id="remember"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="btn-primary">Sign in</button>
    </form>

    <p class="login-footer">Meinhardt · Transforming Cities, Shaping the Future</p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
